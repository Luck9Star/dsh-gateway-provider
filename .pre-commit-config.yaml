# Secret-scanning hook for local commits.
#
# One-time setup per clone:
#   brew install pre-commit gitleaks   # or: pip install pre-commit
#   pre-commit install
#
# Run manually against everything:
#   pre-commit run --all-files
#
# CI enforces the same scan on every push/PR (.github/workflows/gitleaks.yml),
# so this hook is a convenience, not the only line of defense.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
